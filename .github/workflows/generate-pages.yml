name: Generate anime pages for SEO

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: anime-seo-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate anime pages, index, and sitemap
        run: node scripts/generate-anime-pages.mjs

      - name: Show generated files
        run: |
          echo "Anime directory:"
          find anime -maxdepth 1 -type f -name '*.html' | wc -l || true
          echo "Sitemap:"
          test -f sitemap.xml && wc -c sitemap.xml || true

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anime/ sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update anime pages and sitemap"
          git push
